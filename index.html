<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления сотрудниками и проектами</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Боковая панель -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Переключить панель">☰</button>

      <div class="sidebar-content">
        <h2 class="sidebar-title">📊 Панель управления</h2>

        <!-- Выбор периода -->
        <div class="period-selector">
          <select id="monthSelect" class="form-select">
            <!-- Заполняется JS -->
          </select>
          <select id="yearSelect" class="form-select">
            <!-- Заполняется JS -->
          </select>
        </div>

        <!-- Навигация -->
        <nav class="nav-tabs">
          <button class="nav-tab active" data-view="projects">📁 Проекты</button>
          <button class="nav-tab" data-view="employees">👥 Сотрудники</button>
        </nav>

        <!-- Действия -->
        <div class="sidebar-actions">
          <button class="btn btn-secondary" id="seedDataBtn">🌱 Данные посева</button>
          <button class="btn btn-primary" id="addBtn">➕ Добавить</button>
        </div>
      </div>
    </aside>

    <!-- Основная область -->
    <main class="main-content">
      <!-- Таблица проектов -->
      <section id="projectsView" class="view active">
        <div class="view-header">
          <h1>Проекты</h1>
          <div class="view-actions">
            <span class="total-profit" id="totalProfit"></span>
          </div>
        </div>

        <!-- Фильтры -->
        <div class="filters-bar" id="projectsFilters"></div>

        <!-- Таблица -->
        <div class="table-container">
          <table class="data-table" id="projectsTable">
            <thead>
              <tr>
                <th data-sort="company" data-filter>Компания ⇅ ⌕</th>
                <th data-sort="name" data-filter>Проект ⇅ ⌕</th>
                <th data-sort="budget">Бюджет ⇅</th>
                <th data-sort="staff">Персонал ⇅</th>
                <th data-sort="forecast">Прогноз ⇅</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="projectsBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Таблица сотрудников -->
      <section id="employeesView" class="view">
        <div class="view-header">
          <h1>Сотрудники</h1>
        </div>

        <div class="filters-bar" id="employeesFilters"></div>

        <div class="table-container">
          <table class="data-table" id="employeesTable">
            <thead>
              <tr>
                <th data-sort="firstName" data-filter>Имя ⇅ ⌕</th>
                <th data-sort="lastName" data-filter>Фамилия ⇅ ⌕</th>
                <th data-sort="age">Возраст ⇅</th>
                <th data-sort="position" data-filter>Должность ⇅ ⌕</th>
                <th data-sort="salary">Зарплата ⇅</th>
                <th data-sort="payment">Выплата ⇅</th>
                <th>Проект</th>
                <th data-sort="profit">Доход ⇅</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="employeesBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Выдвижная панель формы -->
  <div class="slide-panel" id="slidePanel">
    <button class="slide-panel-close" id="slidePanelClose">×</button>
    <div id="slidePanelContent"></div>
  </div>

  <!-- Модальные окна -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modalContainer"></div>

  <!-- Контейнер для попапов -->
  <div id="popupContainer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
