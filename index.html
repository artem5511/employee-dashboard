<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления сотрудниками и проектами</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Боковая панель -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Переключить панель">☰</button>
      <div class="sidebar-content">
        <h2 class="sidebar-title">📊 Панель управления</h2>
        <div class="period-selector">
          <select id="monthSelect" class="form-select"></select>
          <select id="yearSelect" class="form-select"></select>
        </div>
        <nav class="nav-tabs">
          <button class="nav-tab active" data-view="projects">📁 Проекты</button>
          <button class="nav-tab" data-view="employees">👥 Сотрудники</button>
        </nav>
        <div class="sidebar-actions">
          <button class="btn btn-secondary" id="seedDataBtn">🌱 Данные посева</button>
          <button class="btn btn-primary" id="addBtn">➕ Добавить</button>
        </div>
      </div>
    </aside>

    <!-- Основная область -->
    <main class="main-content">
      <!-- Проекты -->
      <section id="projectsView" class="view active">
        <div class="view-header">
          <h1>Проекты</h1>
          <span class="total-profit" id="totalProfit"></span>
        </div>
        <div class="filters-bar" id="projectsFilters"></div>
        <div class="table-container">
          <table class="data-table" id="projectsTable">
            <thead>
              <tr>
                <th data-sort="company" data-filter>Компания <span class="sort-icon">⇅</span> <span class="filter-icon">⌕</span></th>
                <th data-sort="name" data-filter>Проект <span class="sort-icon">⇅</span> <span class="filter-icon">⌕</span></th>
                <th data-sort="budget">Бюджет <span class="sort-icon">⇅</span></th>
                <th data-sort="staff">Персонал <span class="sort-icon">⇅</span></th>
                <th data-sort="forecast">Прогноз <span class="sort-icon">⇅</span></th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="projectsBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Сотрудники -->
      <section id="employeesView" class="view">
        <div class="view-header">
          <h1>Сотрудники</h1>
        </div>
        <div class="filters-bar" id="employeesFilters"></div>
        <div class="table-container">
          <table class="data-table" id="employeesTable">
            <thead>
              <tr>
                <th data-sort="firstName" data-filter>Имя <span class="sort-icon">⇅</span> <span class="filter-icon">⌕</span></th>
                <th data-sort="lastName" data-filter>Фамилия <span class="sort-icon">⇅</span> <span class="filter-icon">⌕</span></th>
                <th data-sort="age">Возраст <span class="sort-icon">⇅</span></th>
                <th data-sort="position" data-filter>Должность <span class="sort-icon">⇅</span> <span class="filter-icon">⌕</span></th>
                <th data-sort="salary">Зарплата <span class="sort-icon">⇅</span></th>
                <th data-sort="payment">Выплата <span class="sort-icon">⇅</span></th>
                <th>Проект</th>
                <th data-sort="profit">Доход <span class="sort-icon">⇅</span></th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="employeesBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Выдвижная панель -->
  <div class="slide-panel" id="slidePanel">
    <button class="slide-panel-close" id="slidePanelClose">×</button>
    <div id="slidePanelContent"></div>
  </div>

  <!-- Модальные окна -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modalContainer"></div>
  <div id="popupContainer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
